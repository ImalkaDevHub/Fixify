[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fixify-api"
version = "0.1.0"
description = "Fixify project management and website scanning API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "anthropic>=1.17,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "playwright>=1.64,<2",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  # Syntax checks for AI-proposed JavaScript / TypeScript / CSS changes (parse only).
  "tree-sitter>=0.25,<1",
  "tree-sitter-css>=0.23,<1",
  "tree-sitter-javascript>=0.23,<1",
  "tree-sitter-typescript>=0.23,<1",
  "uvicorn[standard]>=0.36,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

