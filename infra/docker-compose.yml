# Local infrastructure. Default: PostgreSQL + Redis only (run the API, worker, and web app on the
# host). Opt-in profiles:
#   --profile worker   browser worker in a hardened container
#   --profile app      migrations (one-shot), API and web app containers
#                      (use together with --profile worker)
# Secrets are read from the root .env (see .env.example); nothing secret is hard-coded here.

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fixify}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-fixify}
  REDIS_URL: redis://redis:6379/0
  QUEUE_BACKEND: redis
  ARTIFACT_DIR: /artifacts
  SECRET_KEY: ${SECRET_KEY:-}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
  EMAIL_FROM: ${EMAIL_FROM:-Fixify <no-reply@localhost>}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  AI_PROVIDER: ${AI_PROVIDER:-anthropic}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
  AI_EFFORT: ${AI_EFFORT:-medium}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  SCANNER_MAX_LINKS: ${SCANNER_MAX_LINKS:-25}
  SCANNER_MAX_SCAN_DURATION_SECONDS: ${SCANNER_MAX_SCAN_DURATION_SECONDS:-180}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixify}
      POSTGRES_USER: ${POSTGRES_USER:-fixify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    # Host port is configurable (POSTGRES_HOST_PORT) for machines that already run a native
    # PostgreSQL on 5432. Bound to 127.0.0.1 only. Containers reach it as postgres:5432.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Browser worker. Opt-in: docker compose --profile worker ... up -d --build
  worker:
    profiles: ["worker"]
    build:
      context: ../services/api
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *backend-env
    # The API serves screenshots from the same directory.
    volumes:
      - ../services/api/.artifacts:/artifacts
    # No published ports, no Docker socket, no host directories besides the artifact folder.
    init: true
    shm_size: "1gb"
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  # One-shot: applies Alembic migrations (forward only) before the API starts.
  migrate:
    profiles: ["app", "worker"]
    build:
      context: ../services/api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backend-env
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  api:
    profiles: ["app"]
    build:
      context: ../services/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      # Only the web container forwards client addresses.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ../services/api/.artifacts:/artifacts
    expose: ["8000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web:
    profiles: ["app"]
    build:
      context: ../apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
  redis_data:
